name: torbox-media-center
services:
    torbox-media-center:
        build:
            context: .
            dockerfile: dockerfile
        image: torbox-media-center-local:latest
        container_name: torbox-media-center
        stdin_open: true
        tty: true
        restart: unless-stopped
        volumes:
            - ./torbox:/torbox
        environment:
            TORBOX_API_KEY: ${TORBOX_API_KEY:?Set TORBOX_API_KEY in .env}
            TMDB_API_KEY: ${TMDB_API_KEY:-}
            TVDB_API_KEY: ${TVDB_API_KEY:-}
            TVDB_PIN: ${TVDB_PIN:-}
            METADATA_PROVIDERS: ${METADATA_PROVIDERS:-tmdb,tvdb,kitsu}
            METADATA_LANGUAGE: ${METADATA_LANGUAGE:-pl-PL}
            MOUNT_METHOD: strm
            MOUNT_PATH: /torbox
            RAW_MODE: ${RAW_MODE:-false}
            ENABLE_METADATA: ${ENABLE_METADATA:-false}
            MOUNT_REFRESH_TIME: ${MOUNT_REFRESH_TIME:-slow}
